<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Sleeping Card</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #003C64; /* same as canvas background */
    }
  </style>
</head>

<body>

  <!-- ====================================================== -->
  <!-- MediaPipe core utilities                              -->
  <!-- ====================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.min.js"></script>

  <!-- ====================================================== -->
  <!-- p5.js + p5.sound (must come BEFORE your scripts)       -->
  <!-- ====================================================== -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>

  <!-- ====================================================== -->
  <!-- OPTIONAL ml5 (harmless — keep or remove)               -->
  <!-- ====================================================== -->
  <script src="https://unpkg.com/ml5@1.0.1/dist/ml5.min.js"></script>

  <!-- ====================================================== -->
  <!-- Your detection bridge (MediaPipe → p5)                 -->
  <!-- ====================================================== -->
  <script src="detection/MediaPipeHands.js"></script>

  <!-- ====================================================== -->
  <!-- Your main p5 sketch (splash + knock)                   -->
  <!-- ====================================================== -->
  <script src="main.js"></script>

</body>
</html>
